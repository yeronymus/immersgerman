networks:
  ollama-net:
    driver: bridge
    internal: true # Ollama network is isolated, no outbound access allowed
  monitoring-net:
    driver: bridge
  public-net:
    driver: bridge

volumes:
  ollama_data:
  vault_data:
  prometheus_data:
  grafana_data:

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik_gateway
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik:/etc/traefik:ro"
    networks:
      - public-net
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.16
    container_name: hashicorp_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/file
    networks:
      - public-net
    cap_add:
      - IPC_LOCK
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`localhost`) && PathPrefix(`/vault`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    restart: unless-stopped

  etl_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl_daemon
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - ollama-net
      - monitoring-net
      - public-net # Needed to communicate with Vault
    depends_on:
      - vault
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: local_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama-net
    # Uncomment below to enable NVIDIA GPU acceleration if NVIDIA Container Toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus_monitor
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - monitoring-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: grafana_dashboards
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - monitoring-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`localhost`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped
