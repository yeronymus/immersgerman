global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertrules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "etl_daemon"
    static_configs:
      - targets: ["etl_daemon:8000"]
